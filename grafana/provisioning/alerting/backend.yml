apiVersion: 1

groups:
  - orgId: 1
    name: Backend availability
    folder: General Alerting
    interval: 10s
    rules:
      - uid: idrive-backend-down
        title: Backend is not responding
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 'up{job="idrive-backend"}'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 10s
        annotations:
          __dashboardUid__: idrive-overview
          __panelId__: "100"
          summary: IDrive backend is unavailable
          description: The backend has not responded to Prometheus for more than 10 seconds.
        labels:
          severity: critical
        isPaused: false
