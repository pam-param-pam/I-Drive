name: Deploy App

on:
  workflow_dispatch:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy via Cloudflare SSH
        uses: pam-param-pam/cloudflare-ssh-action@v1.0.0
        with:
          host: ${{ secrets.CI_DEPLOYMENT_HOST }}
          username: ${{ secrets.CI_RPI_USERNAME }}
          private-key: ${{ secrets.CI_RPI_SSH_KEY }}
          known-hosts: ${{ secrets.CI_RPI_SSH_KNOWN_HOSTS }}
          service-token-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          service-token-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          command: |
            set -e

            echo "Logging in to GitHub Container Registry..."

            echo "${{ secrets.MY_GITHUB_TOKEN }}" \
              | docker login ghcr.io \
                  -u "${{ github.repository_owner }}" \
                  --password-stdin

            echo "Navigating to idrive..."

            mkdir -p ~/idrive
            cd ~/idrive

            if [ ! -s config.overrides.json ]; then
              printf '{}\n' > config.overrides.json
            fi

            echo "Removing existing .env file..."
            rm -f .env

            echo "Writing environment file..."

            cat <<'EOF' > .env
            IS_DEV_ENV=False

            DEPLOYMENT_HOST=${{ secrets.DEPLOYMENT_HOST }}

            NGINX_PORT=8080
            PROTOCOL=https
            POSTGRES_VOLUME=idrive_postgres_data

            BACKEND_PORT=8001

            BACKEND_SECRET_KEY=${{ secrets.DJANGO_BACKEND_SECRET_KEY }}
            SIGNING_SECRET=${{ secrets.SIGNING_SECRET }}
            BACKEND_BASE_URL=https://${{ secrets.DEPLOYMENT_HOST }}/api

            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}

            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}

            GRAFANA_ADMIN_USER=${{ secrets.GRAFANA_ADMIN_USER }}
            GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
            EOF

            echo "Downloading docker-compose.yml..."

            curl -fsSL \
              -H "Authorization: Bearer ${{ secrets.MY_GITHUB_TOKEN }}" \
              -o docker-compose.yml \
              https://raw.githubusercontent.com/pam-param-pam/I-Drive/master/docker-compose.yml

            echo "Pulling latest images..."
            docker compose pull

            echo "Stopping existing containers..."
            docker compose down

            echo "Starting containers..."
            docker compose up -d

            echo "Deployment finished."
