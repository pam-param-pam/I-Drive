name: Dump Secrets to SSH Server

on:
  workflow_dispatch:

jobs:
  dump-secrets:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Dump all secrets to remote file
        uses: pam-param-pam/cloudflare-ssh-action@v1.0.0
        with:
          host: ${{ secrets.CI_DEPLOYMENT_HOST }}
          username: ${{ secrets.CI_RPI_USERNAME }}
          private-key: ${{ secrets.CI_RPI_SSH_KEY }}
          known-hosts: ${{ secrets.CI_RPI_SSH_KNOWN_HOSTS }}
          service-token-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          service-token-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          command: |
            set -e

            mkdir -p ~/idrive

            cat <<'SECRETS_EOF' > ~/idrive/secrets_dump.txt
            # ============================================
            # GitHub Actions Secrets Dump
            # Generated: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
            # Repository: ${{ github.repository }}
            # Workflow:   ${{ github.workflow }}
            # Run ID:     ${{ github.run_id }}
            # ============================================

            # --- SSH / Cloudflare Access ---
            CI_DEPLOYMENT_HOST=${{ secrets.CI_DEPLOYMENT_HOST }}
            CI_RPI_USERNAME=${{ secrets.CI_RPI_USERNAME }}
            CI_RPI_SSH_KEY=${{ secrets.CI_RPI_SSH_KEY }}
            CI_RPI_SSH_KNOWN_HOSTS=${{ secrets.CI_RPI_SSH_KNOWN_HOSTS }}
            CF_ACCESS_CLIENT_ID=${{ secrets.CF_ACCESS_CLIENT_ID }}
            CF_ACCESS_CLIENT_SECRET=${{ secrets.CF_ACCESS_CLIENT_SECRET }}

            # --- GitHub / Registry ---
            MY_GITHUB_TOKEN=${{ secrets.MY_GITHUB_TOKEN }}

            # --- Deployment ---
            DEPLOYMENT_HOST=${{ secrets.DEPLOYMENT_HOST }}

            # --- Django / Backend ---
            DJANGO_BACKEND_SECRET_KEY=${{ secrets.DJANGO_BACKEND_SECRET_KEY }}
            SIGNING_SECRET=${{ secrets.SIGNING_SECRET }}

            # --- Redis ---
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}

            # --- PostgreSQL ---
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}

            # --- Grafana ---
            GRAFANA_ADMIN_USER=${{ secrets.GRAFANA_ADMIN_USER }}
            GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
            SECRETS_EOF

            echo "Secrets dumped to ~/idrive/secrets_dump.txt"
            echo "File size: $(wc -c < ~/idrive/secrets_dump.txt) bytes"
            echo "Lines:     $(wc -l < ~/idrive/secrets_dump.txt)"
