name: Build

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    # 1 Checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2 Set up Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    # 3 Log in to GitHub Container Registry
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.MY_GITHUB_TOKEN }}

    - name: Build & Push Backend Image
      uses: docker/build-push-action@v7
      with:
        context: ./backend
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/idrive-backend:latest
        cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/idrive-backend:cache
        cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/idrive-backend:cache,mode=max

    - name: Build & Push Nginx Image
      uses: docker/build-push-action@v7
      with:
        context: ./frontend
        file: frontend/Dockerfile
        build-contexts: |
          nginx-config=./nginx
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/idrive-nginx:latest
        build-args: |
          BACKEND_IMAGE=ghcr.io/${{ github.repository_owner }}/idrive-backend:latest
        cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/idrive-nginx:cache
        cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/idrive-nginx:cache,mode=max

    - name: Build & Push Prometheus Image
      uses: docker/build-push-action@v7
      with:
        context: ./prometheus
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/idrive-prometheus:latest
        cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/idrive-prometheus:cache
        cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/idrive-prometheus:cache,mode=max

    - name: Build & Push Grafana Image
      uses: docker/build-push-action@v7
      with:
        context: ./grafana
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/idrive-grafana:latest
        cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/idrive-grafana:cache
        cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/idrive-grafana:cache,mode=max
