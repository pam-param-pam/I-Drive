name: Auto Migrate

on:
  workflow_dispatch:
  workflow_call:

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Run Django migrations on remote VM
        uses: pam-param-pam/cloudflare-ssh-action@v5
        with:
          host: ${{ secrets.CI_DEPLOYMENT_HOST }}
          username: ${{ secrets.CI_RPI_USERNAME }}
          private-key: ${{ secrets.CI_RPI_SSH_KEY }}
          known-hosts: ${{ secrets.CI_RPI_SSH_KNOWN_HOSTS }}
          service-token-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          service-token-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          command: |
            set -e
            echo "Running Django migrations inside container..."
            docker exec idrive-backend python manage.py migrate
            echo "Migrations completed."