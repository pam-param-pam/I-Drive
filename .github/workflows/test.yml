name: Test SSH

on:
  workflow_dispatch:

jobs:
  test-ssh:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Install cloudflared 2026.5.1
        run: |
          curl -L --fail -o /usr/local/bin/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/download/2026.5.1/cloudflared-linux-amd64
          sudo chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Configure SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CI_RPI_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CI_RPI_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/private-jedrz
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/private-jedrz ~/.ssh/known_hosts

      - name: Test SSH through Cloudflare
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          SSH_HOST: ${{ secrets.CI_DEPLOYMENT_HOST }}
          SSH_USER: ${{ secrets.CI_RPI_USERNAME }}
        run: |
          set -e
          ssh \
            -o 'ProxyCommand=cloudflared access ssh --hostname %h --id "$CF_ACCESS_CLIENT_ID" --secret "$CF_ACCESS_CLIENT_SECRET"' \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/private-jedrz \
            "${SSH_USER}@${SSH_HOST}" \
            'echo "SSH connection successful"; hostname; whoami; pwd; date'