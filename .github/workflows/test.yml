name: Test SSH

on:
  workflow_dispatch:

jobs:
  test-ssh:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Install cloudflared 2026.5.1
        run: |
          sudo curl -L --fail -o /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/download/2026.5.1/cloudflared-linux-amd64
          sudo chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Test SSH through Cloudflare
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CI_RPI_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/private-jedrz
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/private-jedrz

          ssh -vvv -o 'ProxyCommand=cloudflared access ssh --hostname %h --id 5ce209c70fb12662ab0484cd65cb6e2d.access --secret b92920e5c35d9f60f930338bd0d3839708d3dd4a831d585bd7beffd138c94b2c --log-level debug --logfile /dev/stderr' -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -o BatchMode=yes -i ~/.ssh/private-jedrz jedrz@ssh.pamparampam.dev 'hostname && whoami'