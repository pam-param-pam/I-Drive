name: Test SSH

on:
  workflow_dispatch:

jobs:
  test-ssh:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Configure SSH through Cloudflare Tunnel
        uses: NX1X/cloudflare-tunnel-ssh-action@v1
        with:
          cf-access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          cf-access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          ssh-private-key: ${{ secrets.CI_RPI_SSH_KEY }}
          ssh-host: ${{ secrets.CI_DEPLOYMENT_HOST }}
          ssh-user: ${{ secrets.CI_RPI_USERNAME }}
          cloudflared-version: "2026.5.1"
          test-connection: "false"

      - name: Fix Cloudflare service-token wrapper
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          cat > ~/.cloudflared-ssh <<'EOF'
          #!/bin/bash
          exec cloudflared access ssh --hostname "$2" --id "$CF_ACCESS_CLIENT_ID" --secret "$CF_ACCESS_CLIENT_SECRET"
          EOF
          chmod 700 ~/.cloudflared-ssh

          {
            echo "CF_ACCESS_CLIENT_ID=$CF_ACCESS_CLIENT_ID"
            echo "CF_ACCESS_CLIENT_SECRET=$CF_ACCESS_CLIENT_SECRET"
          } >> "$GITHUB_ENV"

      - name: Test SSH connection
        env:
          SSH_HOST: ${{ secrets.CI_DEPLOYMENT_HOST }}
          SSH_USER: ${{ secrets.CI_RPI_USERNAME }}
        run: |
          set -e
          ssh -o BatchMode=yes "${SSH_USER}@${SSH_HOST}" \
            'echo "SSH connection successful"; hostname; whoami; pwd; date'