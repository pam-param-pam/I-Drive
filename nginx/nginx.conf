load_module modules/ngx_http_js_module.so;
env SIGNING_SECRET;

worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    js_import auth from /etc/nginx/auth.js;

    proxy_cache_path /var/cache/nginx
        levels=1:2
        keys_zone=thumbnail_cache:50m
        max_size=5g
        inactive=365d
        use_temp_path=off;

    limit_req_zone $binary_remote_addr zone=stream_rate:10m rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

    # Pass WebSocket upgrade headers only when the client requested an upgrade.
    # An empty value removes the Connection header and permits upstream keepalive.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream backend_upstream {
        server backend:8000;
        keepalive 32;
    }

    server {
        listen 80;
        charset utf-8;

        root /var/www/idrive/frontend;

        access_log /var/log/nginx/access.log;
        error_log  /var/log/nginx/error.log;

        # Shared by every location that proxies to Django.
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        error_page 404 /error404;
        error_page 429 /error429;
        error_page 500 502 503 504 /error500;

        location = /error404 {
            internal;
            default_type application/json;
            return 404 '{"error":"errors.nginxError", "details":"Not found", "code":404}';
        }

        location = /error429 {
            internal;
            default_type application/json;
            add_header Retry-After 30 always;
            return 429 '{"error":"errors.nginxError", "details":"Enhance your calm!", "code":429}';
        }

        location = /error500 {
            internal;
            default_type application/json;
            return 500 '{"error":"errors.nginxError", "details":"Internal server error", "code":500}';
        }

        location = /healthcheck {
            access_log off;
            default_type text/plain;
            return 200 'Nginx is healthy';
        }

        # Prometheus scrapes Django directly over the internal Docker network.
        # Never expose its metrics endpoint through the public reverse proxy.
        location = /api/metrics {
            access_log off;
            return 404;
        }

        # Django static files. The ^~ prevents frontend regex handling.
        location ^~ /api/static/ {
            alias /var/www/idrive/backend-static/;
            add_header X-Nginx-Location api-static always;
        }

        # Signed thumbnail streams cached by Nginx
        # Must precede the more general /stream$ regex
        location ~ ^/api/files/[^/]+/thumbnail/[^/]+/stream$ {
            set $original_uri $uri;
            set $original_sig $arg_sig;
            set $original_expires $arg_expires;

            auth_request /validate_signature;
            error_page 403 /thumbnail_forbidden;

            proxy_cache thumbnail_cache;
            proxy_cache_methods GET;
            proxy_cache_valid 200 365d;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_key "$scheme$request_method$host$uri";
            proxy_cache_lock on;
            proxy_cache_background_update on;

            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;

            add_header X-Cache-Status $upstream_cache_status always;
            add_header Cache-Control "private, max-age=31536000, immutable" always;

            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://backend_upstream;
        }

        # Other Django streaming endpoints
        location ~ ^/api/(?:.+/)?stream$ {
            limit_req zone=stream_rate burst=20 nodelay;
            limit_req_status 429;

            limit_conn conn_limit_per_ip 5;
            limit_conn_status 429;

            error_page 429 /too_many_connections;

            proxy_buffering off;

            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://backend_upstream;
        }

        # General Django API
        location /api/ {
            proxy_pass http://backend_upstream/;
        }

        # Grafana dashboard, served beneath the public /grafana/ path.
        location ^~ /grafana/ {
            proxy_pass http://grafana:3000/;
        }

        # Serve all STATIC files SPA (vue frontend)
        location ^~ /assets/ {
            gzip_static on;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Vue SPA and its index.html fallback.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        location = /too_many_connections {
            internal;
            default_type application/json;
            add_header Retry-After 30 always;
            return 429 '{"error":"errors.nginxError", "details":"Too many concurrent streams from this IP", "code":429}';
        }

        location = /thumbnail_forbidden {
            internal;
            default_type application/json;
            return 403 '{"error":"errors.nginxError", "details":"Invalid signature params", "code":403}';
        }

        location = /validate_signature {
            internal;
            js_content auth.validate;
        }
    }
}
